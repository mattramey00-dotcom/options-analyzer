name: Daily data update

on:
  schedule:
    # 21:35 UTC, Mon-Fri = ~4:35pm ET (after US market close, both EST/EDT)
    - cron: "35 21 * * 1-5"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan for earnings plays
        run: |
          python scan_earnings.py --days 60 --price-min 8 --price-max 30 --max-pe 50

      - name: Re-fetch full catalyst data
        run: python refetch_full.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_data.json
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
          else
            git commit -m "Daily data update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
